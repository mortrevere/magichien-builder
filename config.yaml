paths:
  assets: assets
  processed: assets/processed
  rendered: preview

card:
  size_mm: [63, 89]
  # Replace size_mm with size_px: [744, 1051] to specify trim pixels.
  dpi: 300
  bleed_mm: 2.5
  safe_margin_mm: 4

background: assets/background.png
back: assets/BACK.png

pdf:
  icc_profile: assets/profiles/PSOcoated_v3.icc

cleanup:
  # Normalized source coordinates: left, top, right, bottom.
  crop: [0, 0, 1, 0.92]
  trim: true
  assets:
    background.png:
      crop: [0, 0, 1, 1]
      trim: false
    BACK.png:
      crop: [0, 0, 1, 1]
      trim: true

digits:
  detection_alpha: 32
  # Sheets must contain 1234567890 in that order.
  # Optional filename -> nine split x coordinates in the cleaned sheet (pixels).
  split_boundaries: {}

layout:
  frame:
    # Center and maximum size, as fractions of the trim canvas.
    center: [0.5, 0.5]
    size: [0.87, 0.87]
  subject:
    # Center and maximum size, as fractions of the fitted frame.
    center: [0.5, 0.5]
    # Leave breathing room above tall weapons, hats, and towers.
    size: [0.66, 0.76]
    scale: 1.0
  numbers:
    height: 0.12  # Fraction of fitted frame height.
    max_width: 0.18 # Fit the whole label inside the corner, including two digits.
    spacing: 0.05 # Gap between digits, as a fraction of number height.
    placements:
      # Align to the inner edges of each corner, independently of digit count.
      - center: [0.19, 0.13]
        align: left
        rotation: 0
      - center: [0.81, 0.895]
        align: right
        rotation: 180

# Each override can contain frame, subject, and/or numbers layout fields.
families: {}
# Exact filenames, including the extension. These override family defaults.

paths:
  assets: assets
  processed: assets/processed
  rendered: preview

card:
  size_mm: [63, 89]
  # Replace size_mm with size_px: [744, 1051] to specify trim pixels.
  dpi: 300
  bleed_mm: 3

background: assets/background.png

cleanup:
  # Normalized source coordinates: left, top, right, bottom.
  crop: [0, 0, 1, 0.92]
  trim: true
  assets:
    background.png:
      crop: [0, 0, 1, 1]
      trim: false

digits:
  detection_alpha: 32
  # Sheets must contain 1234567890 in that order.
  # Optional filename -> nine split x coordinates in the cleaned sheet (pixels).
  split_boundaries: {}

layout:
  frame:
    # Center and maximum size, as fractions of the trim canvas.
    center: [0.5, 0.5]
    size: [0.94, 0.94]
  subject:
    # Center and maximum size, as fractions of the fitted frame.
    center: [0.48, 0.49]
    size: [0.66, 0.86]
    scale: 1.0
  numbers:
    height: 0.13  # Fraction of fitted frame height.
    spacing: 0.05 # Gap between digits, as a fraction of number height.
    placements:
      - center: [0.17, 0.135]
        rotation: 0
      - center: [0.85, 0.895]
        rotation: 180

# Each override can contain frame, subject, and/or numbers layout fields.
families: {}
# Exact filenames, including the extension. These override family defaults.
cards:
  GREEN_5.png:
    subject:
      center: [0.48, 0.49]
      size: [0.66, 0.86]
      scale: 1.0

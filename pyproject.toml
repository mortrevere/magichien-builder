[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magichien-builder"
version = "0.1.0"
description = "Compose printable card decks from transparent PNG assets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow>=11", "PyYAML>=6"]

[project.scripts]
magichien-builder = "magichien_builder.main:main"

[tool.setuptools.packages.find]
include = ["magichien_builder*"]
